<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Gradients for modern maritime depth -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    
    <filter id="subtleDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B2545" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ICON GROUP: Stylized 'S' Maritime & Multimodal Mark -->
  <g transform="translate(15, 10)">
    <!-- Background subtle glow/shield base optional, keeping it crisp and clean -->
    
    <!-- 1. Top Wave / Ship Bow Foil (Cyan) -->
    <path d="M 68 12 C 45 12, 22 25, 16 44 C 23 34, 37 28, 54 28 C 72 28, 86 36, 88 48 L 96 42 C 93 25, 83 12, 68 12 Z" 
          fill="url(#cyanGrad)" filter="url(#subtleDrop)"/>
          
    <!-- 2. Central Cargo Nexus / Geometric Isometric Facet (Safety Orange) -->
    <!-- Represents the ISO freight container in motion / connection -->
    <path d="M 38 43 L 74 37 L 66 57 L 30 63 Z" 
          fill="url(#orangeGrad)"/>
    <path d="M 74 37 L 88 46 L 80 66 L 66 57 Z" 
          fill="#D97706"/>
          
    <!-- 3. Bottom Ocean Hull / Keel Wave (Deep Navy) -->
    <path d="M 34 88 C 57 88, 80 75, 86 56 C 79 66, 65 72, 48 72 C 30 72, 16 64, 14 52 L 6 58 C 9 75, 19 88, 34 88 Z" 
          fill="url(#navyGrad)" filter="url(#subtleDrop)"/>
          
    <!-- Dynamic Radar Pulse Ring Accent (Cyan dot) -->
    <circle cx="86" cy="22" r="5" fill="#38BDF8"/>
  </g>

  <!-- TYPOGRAPHY: SORA CARGO -->
  <g transform="translate(130, 74)">
    <!-- 'SORA' in Bold Deep Ocean Navy -->
    <text font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#0B2545">SORA</text>
          
    <!-- 'CARGO' in Electric Cyan with Navy outline/accent -->
    <text x="168" 
          font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="500" 
          letter-spacing="3" 
          fill="#0284C7">CARGO</text>
          
    <!-- Accent underline bar representing maritime waterline & radar speed -->
    <rect x="168" y="10" width="180" height="4" rx="2" fill="url(#orangeGrad)"/>
    <circle cx="356" cy="12" r="3" fill="#F59E0B"/>
  </g>
</svg>

