<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    
    <linearGradient id="whiteGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    
    <linearGradient id="orangeGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- ICON GROUP: Stylized 'S' Maritime & Multimodal Mark -->
  <g transform="translate(15, 10)">
    <!-- 1. Top Wave / Ship Bow Foil (Cyan) -->
    <path d="M 68 12 C 45 12, 22 25, 16 44 C 23 34, 37 28, 54 28 C 72 28, 86 36, 88 48 L 96 42 C 93 25, 83 12, 68 12 Z" 
          fill="url(#cyanGradW)"/>
          
    <!-- 2. Central Cargo Nexus / Isometric Box (Safety Orange) -->
    <path d="M 38 43 L 74 37 L 66 57 L 30 63 Z" 
          fill="url(#orangeGradW)"/>
    <path d="M 74 37 L 88 46 L 80 66 L 66 57 Z" 
          fill="#D97706"/>
          
    <!-- 3. Bottom Ocean Hull / Keel Wave (White/Ice) -->
    <path d="M 34 88 C 57 88, 80 75, 86 56 C 79 66, 65 72, 48 72 C 30 72, 16 64, 14 52 L 6 58 C 9 75, 19 88, 34 88 Z" 
          fill="url(#whiteGradW)"/>
          
    <!-- Radar Accent Dot -->
    <circle cx="86" cy="22" r="5" fill="#38BDF8"/>
  </g>

  <!-- TYPOGRAPHY: SORA CARGO (White / Light) -->
  <g transform="translate(130, 74)">
    <text font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="1.5" 
          fill="#FFFFFF">SORA</text>
          
    <text x="168" 
          font-family="'Poppins', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="52" 
          font-weight="500" 
          letter-spacing="3" 
          fill="#38BDF8">CARGO</text>
          
    <rect x="168" y="10" width="180" height="4" rx="2" fill="url(#orangeGradW)"/>
    <circle cx="356" cy="12" r="3" fill="#F59E0B"/>
  </g>
</svg>

