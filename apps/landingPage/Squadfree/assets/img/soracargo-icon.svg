<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="iconNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>
    <linearGradient id="iconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B2545" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Optional background rounded tile for app icon -->
  <rect width="120" height="120" rx="28" fill="#0B2545"/>
  
  <!-- Stylized 'S' Mark -->
  <g transform="translate(14, 14)">
    <!-- 1. Top Wave / Hydrofoil (Cyan) -->
    <path d="M 68 12 C 45 12, 22 25, 16 44 C 23 34, 37 28, 54 28 C 72 28, 86 36, 88 48 L 96 42 C 93 25, 83 12, 68 12 Z" 
          fill="url(#iconCyan)" filter="url(#iconShadow)"/>
          
    <!-- 2. Central Cargo Container Facet (Safety Orange) -->
    <path d="M 38 43 L 74 37 L 66 57 L 30 63 Z" 
          fill="url(#iconOrange)"/>
    <path d="M 74 37 L 88 46 L 80 66 L 66 57 Z" 
          fill="#D97706"/>
          
    <!-- 3. Bottom Ocean Hull Curve (White/Ice) -->
    <path d="M 34 88 C 57 88, 80 75, 86 56 C 79 66, 65 72, 48 72 C 30 72, 16 64, 14 52 L 6 58 C 9 75, 19 88, 34 88 Z" 
          fill="#FFFFFF" filter="url(#iconShadow)"/>
          
    <!-- Radar Accent Dot -->
    <circle cx="86" cy="22" r="5" fill="#38BDF8"/>
  </g>
</svg>

