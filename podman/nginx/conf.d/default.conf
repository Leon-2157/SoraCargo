# 1. Customer Portal (Public Access)
server {
    listen 80;
    server_name customer.soracargo.local soracargo.local;

    # Akses Publik Terbuka
    allow all;

    root /var/www/apps/customer/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app-customer:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# 2. Operator Portal (Semi-Private - Regional VPN Gateway)
server {
    listen 80;
    server_name ops.soracargo.local ops-id.soracargo.local;

    # Pembatasan Akses: Hanya Subnet VPN Operator Cabang
    # allow 10.8.0.0/24;       # Subnet Wireguard / OpenVPN Regional ID
    # allow 100.64.0.0/10;     # Subnet Tailscale Operator
    # deny all;                # Blokir IP internet publik lainnya

    root /var/www/apps/operator/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app-operator:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# 3. Global Admin Portal (Strictly Private - Admin / Laptop Anda)
server {
    listen 80;
    server_name admin.soracargo.local admin.soracargo.internal;

    # Pembatasan Akses Ketat: Hanya IP Laptop Anda / Private Mesh VPN
    # allow 10.99.0.5/32;      # IP Laptop Khusus Anda
    # allow 127.0.0.1;         # Localhost SSH Tunnel
    # deny all;                # Blokir siapapun di luar whitelist

    root /var/www/apps/admin/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app-admin:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

